[project]
name = "ergon-examples"
version = "0.1.0"
description = "Runnable Ergon examples and getting-started tutorials"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "ergon-core",
    "ergon-builtins[data]",
    "huggingface_hub",
]

[tool.uv.sources]
ergon-core = { workspace = true }
ergon-builtins = { workspace = true }

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["getting_started*", "experiment_api*"]
